<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Matchweek · Status</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;700&family=Chakra+Petch:wght@500;600&display=swap">
<style>
:root{--p1:#37003C;--blue:#2E5BFF;--gold:#FFD23F;--ink:#1B1420;--mid:#6B6076;--bg:#F4F1F6;--card:#fff;--ok:#0E8A5F;--bad:#C41E3A;--warn:#8A5A00;
--disp:'Archivo Black',sans-serif;--body:'Space Grotesk',system-ui,sans-serif;--num:'Chakra Petch',monospace}
*{box-sizing:border-box}body{margin:0;font-family:var(--body);background:var(--bg);color:var(--ink);font-size:16px;line-height:1.55}
.top{background:linear-gradient(150deg,#2A0030,#4A0E56 45%,#2E3FB8 108%);color:#fff;padding:14px 20px;border-bottom:3px solid var(--gold);font-family:var(--disp)}
.top b{color:var(--gold);font-weight:400}
main{max-width:680px;margin:0 auto;padding:28px 18px 60px}
h1{font-family:var(--disp);font-weight:400;font-size:1.4rem;color:var(--p1);margin:0 0 4px}
p.sub{color:var(--mid);margin:0 0 20px}
.card{background:var(--card);border:1px solid #DED7E4;border-radius:8px;padding:16px 18px;margin:12px 0}
h2{font-size:1rem;margin:0 0 10px}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th{font-family:var(--num);font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mid);text-align:left;padding:5px 8px;border-bottom:1px solid #DED7E4}
td{padding:6px 8px;border-bottom:1px solid #EEE9F2;font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:baseline}
.ok{background:var(--ok)}.bad{background:var(--bad)}.warn{background:#E3B341}
.age{font-family:var(--num)}
.state{color:var(--mid)}
</style></head><body>
<div class="top">MATCH<b>WEEK</b> · status</div>
<main>
<h1>Is the data fresh?</h1>
<p class="sub">The refresher runs hourly (every 10 minutes while matches are live). Green means a league updated within the last 75 minutes.</p>
<div class="card"><h2>Leagues</h2><div id="lg" class="state">Loading…</div></div>
<div class="card"><h2>Recent refresh runs</h2><div id="runs" class="state">Loading…</div></div>
</main>
<script>
const API='https://vcokquhzqpqvwrybndnr.supabase.co/functions/v1/tabs/health';
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ago=t=>{if(!t)return '—';const m=Math.round((Date.now()-Date.parse(t))/60000);return m<1?'just now':m<60?m+' min ago':Math.round(m/6)/10+' h ago'};
fetch(API,{cache:'no-store'}).then(r=>r.json()).then(j=>{
  document.getElementById('lg').innerHTML='<table><tr><th></th><th>League</th><th>Standings updated</th></tr>'+
    j.leagues.map(l=>{const mins=l.standingsUpdated?(Date.now()-Date.parse(l.standingsUpdated))/60000:1e9;
      const cls=mins<=75?'ok':mins<=180?'warn':'bad';
      return '<tr><td><span class="dot '+cls+'"></span></td><td>'+esc(l.name)+' <span class="age" style="color:var(--mid)">#'+l.league+'</span></td><td class="age">'+ago(l.standingsUpdated)+'</td></tr>'}).join('')+'</table>';
  document.getElementById('runs').innerHTML='<table><tr><th></th><th>Started</th><th>Took</th><th>Note</th></tr>'+
    j.runs.map(r=>{const secs=r.finished_at?Math.round((Date.parse(r.finished_at)-Date.parse(r.started_at))/1000)+' s':'—';
      return '<tr><td><span class="dot '+(r.ok?'ok':'bad')+'"></span></td><td class="age">'+ago(r.started_at)+'</td><td class="age">'+secs+'</td><td>'+esc(r.error||'')+'</td></tr>'}).join('')+'</table>';
}).catch(e=>{document.getElementById('lg').textContent='Status service unreachable: '+e.message});
</script></body></html>
