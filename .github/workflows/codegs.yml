# El Matador Tire: the CI gate for Code.gs (ROADMAP A1), no PC needed.
#   On every push to main that touches Code.gs, the tests, the app's source, the Facts bot, the monitor, the parity tool or the Worker
#   (and on demand), runs every test suite in tests/codegs plus tests/*.js, and `node --check` on Code.gs. When all of them pass it fast-forwards the `release` branch to
#   that commit. The live Apps Script updates itself from the release branch (EMT_SELF_SRC in Code.gs, v3.16+), so a
#   push to main that breaks a suite never reaches the league: release simply stays where it was and this run is red.
#   Never force-pushes: a release that is not an ancestor of main is left alone and the run fails, loudly.
name: Code.gs tests and release
on:
  push:
    branches: [main]
    paths: ['Code.gs', 'tests/**', 'fplgg/tools/factsbot/**', 'fplgg/tools/monitor/**', 'fplgg/tools/parity/**', 'fplgg/tools/matchweek/src/**', 'fplgg/tools/matchweek/src-prod/**', 'fplgg/tools/matchweek/core.gen.js', 'site/worker.mjs', 'site/wrangler.jsonc', '.github/workflows/codegs.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: codegs-release, cancel-in-progress: false }
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Syntax check
        run: cp Code.gs /tmp/codegs-check.js && node --check /tmp/codegs-check.js
      - name: Run every suite
        run: |
          set -e
          fail=0
          for f in tests/codegs/*.js; do
            case "$f" in *fixtures*|*harness*) continue ;; esac   # helpers, not suites
            echo "== $f"
            if out=$(node "$f" 2>&1); then
              case "$f" in */test.js) echo "$out" | tail -3 ;; *) echo "$out" | tail -1; echo "$out" | grep -q '^ALL PASS$' || { echo "::error::$f did not print ALL PASS"; fail=1; } ;; esac
            else
              echo "$out" | grep -v '^PASS' | tail -40; echo "::error::$f failed"; fail=1
            fi
          done
          for f in tests/factsbot.js tests/monitor.js tests/parity.js tests/app-errors.js tests/app-tabs.js tests/app-bonus.js tests/app-fdr.js tests/app-faces.js tests/app-feed.js tests/app-show.js tests/worker.js; do
            echo "== $f"
            if out=$(node "$f" 2>&1); then echo "$out" | tail -1; echo "$out" | grep -q '^ALL PASS$' || { echo "::error::$f did not print ALL PASS"; fail=1; }; else echo "$out" | grep -v '^PASS' | tail -40; echo "::error::$f failed"; fail=1; fi
          done
          exit $fail
      - name: Fast-forward the release branch
        run: |
          git fetch origin release || true
          if git rev-parse --verify -q origin/release >/dev/null; then
            if ! git merge-base --is-ancestor origin/release HEAD; then
              echo "::error::release ($(git rev-parse --short origin/release)) is not an ancestor of this commit; not touching it"; exit 1
            fi
            if [ "$(git rev-parse origin/release)" = "$(git rev-parse HEAD)" ]; then echo "release is already here"; exit 0; fi
          fi
          git push origin HEAD:refs/heads/release
          echo "release -> $(git rev-parse --short HEAD)"
