# El Matador Tire: build the Matchweek app from source, no PC needed.
#   On every push to main that changes fplgg/tools/matchweek/**, or Actions tab → Build Matchweek app → Run workflow.
#   Runs fplgg/tools/matchweek/ci-build.sh and commits the six root files it writes (index.html, app.js, app.css,
#   core.js, sw.js, manifest.webmanifest), then fplgg/tools/demo/build-demo.js, which writes matchweek.gg's demo league
#   into site/public/demo (the same app on a frozen, anonymised snapshot of the league's tabs, taken from the Sheet at
#   build time; Parker's Q2, 8 Oct 2026) and fails when a real team or manager name is anywhere under site/public.
#   Cloudflare redeploys matchweek.gg on the commit. Touches nothing else: not classic.html, v12.html, Code.gs or any
#   other file. The daily run refreshes the demo's snapshot, so its gameweek moves with the league's.
#   Before the commit, the contrast audit (fplgg/tools/contrast/audit.js, docs/DESIGN.md) runs on the demo just built: an
#   offender makes the run red and nothing is committed.
#   Details: fplgg/tools/matchweek/README.md and fplgg/tools/demo/README.md
name: Build Matchweek app
on:
  push:
    branches: [main]
    paths: ['fplgg/tools/matchweek/**', '!fplgg/tools/matchweek/docs/**', 'fplgg/tools/demo/**']   # docs (BUGS.md, ARTICLES.md, TONE.md) do not rebuild the app
  schedule:
    - cron: '41 6 * * *'   # the demo's snapshot, once a day (GitHub runs it late, which is fine here)
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: matchweek-build, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: fplgg/tools/matchweek/package-lock.json
      - name: Install esbuild
        working-directory: fplgg/tools/matchweek
        run: npm ci --no-audit --no-fund
      - name: Build
        if: github.event_name != 'schedule'   # the daily run refreshes the demo only, so phones are not asked to re-download an unchanged app
        run: bash fplgg/tools/matchweek/ci-build.sh
      - name: Build the demo league (site/public/demo)
        run: node fplgg/tools/demo/build-demo.js
      - name: Install Playwright for the contrast audit (the Facts bot's pin)
        working-directory: fplgg/tools/factsbot
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: The contrast audit (docs/DESIGN.md) on the demo just built
        run: NODE_PATH=$PWD/fplgg/tools/factsbot/node_modules node fplgg/tools/contrast/audit.js --dir site/public --report /tmp/mw-contrast.json
      - name: Keep the contrast report
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: contrast-report, path: /tmp/mw-contrast.json, if-no-files-found: ignore }
      - name: Commit the build
        run: |
          FILES="index.html app.js app.css core.js sw.js manifest.webmanifest site/public/demo"
          OTHER=$(git status --porcelain --untracked-files=all | grep -v -E '^.. (index\.html|app\.js|app\.css|core\.js|sw\.js|manifest\.webmanifest|site/public/demo/.+)$' || true)
          if [ -n "$OTHER" ]; then echo "build touched other files, refusing to commit:"; echo "$OTHER"; exit 1; fi
          git config user.name "el-matador-build"
          git config user.email "actions@users.noreply.github.com"
          git add -A -- $FILES
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit -m "build: matchweek app from ${GITHUB_SHA::7}"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
