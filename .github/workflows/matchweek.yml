# El Matador Tire: build the Matchweek app from source, no PC needed.
#   On every push to main that changes fplgg/tools/matchweek/**, or Actions tab → Build Matchweek app → Run workflow.
#   Runs fplgg/tools/matchweek/ci-build.sh and commits the six root files it writes (index.html, app.js, app.css,
#   core.js, sw.js, manifest.webmanifest). Touches nothing else: not classic.html, v12.html, Code.gs or any other file.
#   Details: fplgg/tools/matchweek/README.md
name: Build Matchweek app
on:
  push:
    branches: [main]
    paths: ['fplgg/tools/matchweek/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: matchweek-build, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: fplgg/tools/matchweek/package-lock.json
      - name: Install esbuild
        working-directory: fplgg/tools/matchweek
        run: npm ci --no-audit --no-fund
      - name: Build
        run: bash fplgg/tools/matchweek/ci-build.sh
      - name: Commit the build
        run: |
          FILES="index.html app.js app.css core.js sw.js manifest.webmanifest"
          OTHER=$(git status --porcelain --untracked-files=all | grep -v -E '^.. (index\.html|app\.js|app\.css|core\.js|sw\.js|manifest\.webmanifest)$' || true)
          if [ -n "$OTHER" ]; then echo "build touched other files, refusing to commit:"; echo "$OTHER"; exit 1; fi
          git config user.name "el-matador-build"
          git config user.email "actions@users.noreply.github.com"
          git add -- $FILES
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit -m "build: matchweek app from ${GITHUB_SHA::7}"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
