# El Matador Tire / Matchweek: the Supabase functions deploy from the repo (ROADMAP B1, Q8), no PC needed.
#   On every push to main that touches supabase/ (and on demand), runs tests/supabase.js, then deploys every function
#   under supabase/functions/ to the project vcokquhzqpqvwrybndnr with the Supabase CLI, bundled server side (no
#   Docker), with the settings in supabase/config.toml (every function public, as deployed on 31 Aug 2026). The
#   secret SUPABASE_ACCESS_TOKEN is a scoped personal access token Parker created on 10 Oct 2026; nothing here prints
#   it. The schema (supabase/migrations/) is not applied by this workflow: a migration is run through the Management
#   API's query endpoint by the session that writes it, and the file is the record (supabase/README.md).
name: Supabase functions
on:
  push:
    branches: [main]
    paths: ['supabase/functions/**', 'supabase/config.toml', '.github/workflows/supabase.yml', 'tests/supabase.js']
  workflow_dispatch:
permissions:
  contents: read
concurrency: { group: supabase-deploy, cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Test the functions and the folder
        run: node tests/supabase.js
      - name: Deploy every function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -e
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::error::the repository secret SUPABASE_ACCESS_TOKEN is not set (Parker: Settings, Secrets and variables, Actions)"; exit 1; fi
          npx -y supabase@2.120.0 functions deploy --project-ref vcokquhzqpqvwrybndnr --use-api
      - name: Say what is deployed
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx -y supabase@2.120.0 functions list --project-ref vcokquhzqpqvwrybndnr --output json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);(j.functions||j).forEach(f=>console.log(f.slug+" v"+f.version+" "+f.status+" verify_jwt="+f.verify_jwt+" "+new Date(f.updated_at).toISOString()))})'
