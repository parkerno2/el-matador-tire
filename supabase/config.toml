# The Supabase project vcokquhzqpqvwrybndnr (matchweek). Read by the Supabase CLI when .github/workflows/supabase.yml
# deploys the functions; every function here is called without a JWT (verify_jwt off), as deployed on 31 Aug 2026, and
# each is gated in its own code (S1, 11 Oct 2026): the tabs function is read only and serves an allowlist of tabs, the
# ingest and seed-statics require the shared secret INGEST_SECRET (a function secret; pg_cron sends it from Vault), the
# wizard's register-league is gated by the invite code and league-lookup only reads the FPL API.
project_id = "matchweek"

[functions.ingest]
verify_jwt = false

[functions.tabs]
verify_jwt = false

[functions.seed-statics]
verify_jwt = false

[functions.league-lookup]
verify_jwt = false

[functions.register-league]
verify_jwt = false
