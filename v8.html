<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14051B">
<title>El Matador Tire · Matchday</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============ EL MATADOR v8 — Matchday build ============ */
:root{
  --bg0:#14051B; --bg1:#1E0A28; --card:#241030; --card2:#2C1539;
  --ink:#FFFFFF; --sub:#B9A9C7; --faint:#8A7799;
  --gold:#F2C14E; --goldd:#D9A32E; --line:rgba(255,255,255,.08);
  --live:#2EE58A; --bad:#FF6B6B;
  --disp:'Archivo',system-ui,sans-serif; --body:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{background:var(--bg0);color:var(--ink);font-family:var(--body);font-size:15px;
 overflow-x:hidden;min-height:100vh}
body:before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
 background:radial-gradient(120% 55% at 50% -8%,#33124446 0%,transparent 60%)}
.wrap{max-width:520px;margin:0 auto;position:relative;z-index:1;padding-bottom:96px}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;
 padding:calc(12px + env(safe-area-inset-top)) 20px 12px;
 background:linear-gradient(180deg,rgba(20,5,27,.94),rgba(20,5,27,.78));
 backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);
 transition:padding .25s ease}
#lgBadge{width:38px;height:38px;flex:none;transform-style:preserve-3d;will-change:transform}
header .tt{line-height:1.1}
header .tt b{font-family:var(--disp);font-weight:800;font-size:16.5px;letter-spacing:.02em;display:block}
header .tt span{font-size:10.5px;color:var(--faint);font-weight:600;letter-spacing:.14em;text-transform:uppercase}
#gwChip{margin-left:auto;text-align:right;line-height:1.25}
#gwChip b{display:inline-block;background:var(--gold);color:#241300;font-family:var(--disp);
 font-weight:800;font-size:12px;padding:4px 12px;border-radius:14px;letter-spacing:.03em}
#gwChip span{display:block;font-size:10.5px;color:var(--gold);font-weight:700;margin-top:3px;
 font-variant-numeric:tabular-nums;letter-spacing:.06em}

/* ---------- stage carousel ---------- */
#stages{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-ms-overflow-style:none}
#stages::-webkit-scrollbar{display:none}
.stage{flex:0 0 100%;scroll-snap-align:center;position:relative;padding:26px 22px 22px;min-height:472px;
 display:flex;flex-direction:column;overflow:hidden}
.orb{position:absolute;width:340px;height:340px;border-radius:50%;filter:blur(70px);opacity:.34;
 animation:drift 22s ease-in-out infinite alternate;pointer-events:none}
.orb.b{animation-duration:28s;animation-direction:alternate-reverse}
@keyframes drift{from{transform:translate(-6%,-4%) scale(1)}to{transform:translate(8%,7%) scale(1.15)}}
.marq{text-align:center;position:relative}
.marq .d{display:inline-block;font-family:var(--disp);font-weight:800;font-size:13.5px;letter-spacing:.3em;
 text-transform:uppercase;color:var(--gold);padding:9px 6px 8px;
 border-top:1px solid rgba(242,193,78,.55);border-bottom:1px solid rgba(242,193,78,.55)}
.marq .s{display:block;font-size:11.5px;color:var(--sub);margin-top:9px;letter-spacing:.02em}
.duel{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:4px;margin-top:30px;position:relative}
.side{text-align:center;min-width:0}
.side .cr{width:86px;height:93px;margin:0 auto;filter:drop-shadow(0 14px 24px rgba(0,0,0,.5));
 transition:transform .5s cubic-bezier(.2,.9,.3,1.4)}
.stage.on .side .cr{transform:translateY(0)}
.side b{display:block;font-family:var(--disp);font-weight:700;font-size:15px;line-height:1.22;margin-top:12px;
 letter-spacing:.01em;text-wrap:balance}
.side span{display:block;font-size:11.5px;color:var(--faint);margin-top:3px;font-weight:500}
.vs{text-align:center;padding-top:22px;min-width:118px}
.vs .n{font-family:var(--disp);font-weight:900;font-size:33px;letter-spacing:-.01em;
 font-variant-numeric:tabular-nums;white-space:nowrap;text-shadow:0 4px 22px rgba(0,0,0,.5)}
.vs .n small{font-weight:800;font-size:22px;opacity:.55;padding:0 1px}
.vs .t{font-size:9.5px;letter-spacing:.26em;font-weight:800;margin-top:6px;color:var(--sub);text-transform:uppercase}
.vs .t.live{color:var(--live)}
.vs .t.live:before{content:'●';margin-right:5px;animation:pulse 1.6s ease infinite}
@keyframes pulse{50%{opacity:.35}}
/* tale of the tape */
.tape{margin-top:34px;position:relative}
.tape h4{text-align:center;font-size:9.5px;letter-spacing:.3em;color:var(--faint);font-weight:800;
 text-transform:uppercase;margin-bottom:16px}
.trow{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:12px;margin-bottom:15px}
.trow em{font-style:normal;font-family:var(--disp);font-weight:800;font-size:14.5px;
 font-variant-numeric:tabular-nums;text-align:center}
.tmid{text-align:center}
.tmid .lb{font-size:9px;letter-spacing:.2em;color:var(--faint);font-weight:700;text-transform:uppercase;margin-bottom:6px}
.tb{height:5px;border-radius:3px;background:rgba(255,255,255,.1);position:relative;overflow:hidden}
.tb i{position:absolute;top:0;bottom:0;border-radius:3px;width:0;transition:width .9s cubic-bezier(.2,.7,.2,1)}
.tb i.l{left:0}.tb i.r{right:0}
/* star strip */
.stars{display:flex;justify-content:center;align-items:flex-end;gap:9px;margin-top:26px;position:relative}
.stars .gap{width:16px}
.pcard{width:66px;border-radius:10px;padding:7px 4px 6px;text-align:center;position:relative;
 background:linear-gradient(165deg,#F7E3A5,#CDA13C 85%);color:#3D2C05;
 box-shadow:0 10px 22px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.55);
 transform:translateY(10px);opacity:0;transition:transform .5s ease,opacity .5s ease}
.stage.on .pcard{transform:translateY(0);opacity:1}
.stage.on .pcard:nth-child(2){transition-delay:.08s}.stage.on .pcard:nth-child(4){transition-delay:.12s}
.stage.on .pcard:nth-child(5){transition-delay:.2s}
.pcard.sil{background:linear-gradient(165deg,#F2F4F8,#A9B2C2 85%);color:#333A48}
.pcard img{width:44px;height:44px;object-fit:cover;object-position:top;border-radius:8px;display:block;margin:0 auto}
.pcard .o{font-family:var(--disp);font-weight:900;font-size:17px;line-height:1;margin-top:4px}
.pcard .nm{font-size:8px;font-weight:800;letter-spacing:.02em;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .lw{font-size:7px;font-weight:700;opacity:.7;letter-spacing:.12em;text-transform:uppercase}
.pcard .noimg{width:44px;height:44px;border-radius:8px;background:rgba(0,0,0,.14);display:flex;align-items:center;
 justify-content:center;font-family:var(--disp);font-weight:900;font-size:18px;margin:0 auto}
.tapbtn{margin:26px auto 0;display:block;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);
 color:#fff;font-family:var(--body);font-weight:600;font-size:12.5px;padding:11px 26px;border-radius:24px;cursor:pointer;
 backdrop-filter:blur(6px)}
/* dots */
#dots{display:flex;justify-content:center;gap:8px;padding:4px 0 8px}
#dots i{width:7px;height:7px;border-radius:4px;background:rgba(255,255,255,.22);transition:all .3s ease}
#dots i.on{background:var(--gold);width:22px}

/* ---------- sections below ---------- */
section{padding:10px 20px 0}
.sech{display:flex;align-items:baseline;margin:26px 2px 12px}
.sech h2{font-family:var(--disp);font-weight:800;font-size:16px;letter-spacing:.01em}
.sech a{margin-left:auto;font-size:12px;font-weight:600;color:var(--gold);text-decoration:none}
/* program cover */
.cover{display:block;background:linear-gradient(140deg,var(--card2),var(--card) 70%);border:1px solid var(--line);
 border-radius:18px;padding:20px;position:relative;overflow:hidden;color:inherit;text-decoration:none}
.cover:before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,var(--gold),transparent 85%)}
.cover .k{font-size:10.5px;font-weight:800;letter-spacing:.22em;color:var(--gold);text-transform:uppercase}
.cover h3{font-family:var(--disp);font-weight:800;font-size:19px;line-height:1.3;margin-top:10px;letter-spacing:-.01em;text-wrap:balance}
.cover h3 em{font-style:normal;color:var(--gold)}
.cover p{font-size:12.5px;color:var(--sub);margin-top:9px;line-height:1.55}
.cover .go{display:inline-block;margin-top:14px;font-weight:700;font-size:13px;color:var(--gold)}
.cover .nums{display:flex;gap:24px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.cover .nums b{display:block;font-family:var(--disp);font-weight:900;font-size:21px}
.cover .nums span{font-size:9px;letter-spacing:.16em;color:var(--faint);font-weight:700;text-transform:uppercase}
/* standings */
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.srow{display:flex;align-items:center;gap:12px;padding:13px 16px;cursor:pointer}
.srow+ .srow{border-top:1px solid var(--line)}
.srow .rk{width:16px;text-align:center;font-family:var(--disp);font-weight:700;font-size:13px;color:var(--faint)}
.srow .cr2{width:34px;height:37px;flex:none;filter:drop-shadow(0 4px 8px rgba(0,0,0,.4))}
.srow .nm{flex:1;min-width:0}
.srow .nm b{display:block;font-weight:600;font-size:14px;letter-spacing:.01em}
.srow .nm span{font-size:11px;color:var(--faint)}
.srow .rec{font-size:11.5px;color:var(--sub);font-variant-numeric:tabular-nums;font-weight:500}
.srow .pts{width:34px;text-align:right;font-family:var(--disp);font-weight:900;font-size:17px}
.srow.lead{background:linear-gradient(90deg,rgba(242,193,78,.13),transparent 65%)}
.srow.lead .rk{color:var(--gold)}
/* luck */
.seg{display:flex;background:rgba(255,255,255,.07);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:none;background:none;color:var(--sub);font-family:var(--body);font-weight:600;
 font-size:13px;padding:9px 0;border-radius:9px;cursor:pointer;transition:all .25s ease}
.seg button.on{background:var(--gold);color:#241300;font-weight:700}
.lrow{display:flex;align-items:center;gap:12px;padding:12px 16px}
.lrow+ .lrow{border-top:1px solid var(--line)}
.lrow .cr2{width:30px;height:32px;flex:none}
.lrow .nm{flex:1;font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .bar{width:84px;height:5px;border-radius:3px;background:rgba(255,255,255,.1);position:relative;overflow:hidden}
.lrow .bar i{position:absolute;top:0;bottom:0;border-radius:3px}
.lrow .v{width:48px;text-align:right;font-family:var(--disp);font-weight:800;font-size:14.5px;font-variant-numeric:tabular-nums}
.lrow .v.up{color:var(--live)}.lrow .v.dn{color:var(--bad)}
.fn{font-size:11px;color:var(--faint);line-height:1.6;padding:12px 16px;border-top:1px solid var(--line)}
/* reveal on scroll */
.rv{opacity:0;transform:translateY(18px);transition:opacity .6s ease,transform .6s ease}
.rv.in{opacity:1;transform:none}

/* ---------- pitch overlay ---------- */
#pitchOv{position:fixed;inset:0;z-index:60;background:var(--bg0);transform:translateY(104%);
 transition:transform .45s cubic-bezier(.3,.8,.3,1);overflow-y:auto;overscroll-behavior:contain}
#pitchOv.on{transform:none}
#pitchOv .ph2{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;
 padding:calc(12px + env(safe-area-inset-top)) 18px 12px;
 background:linear-gradient(180deg,rgba(20,5,27,.95),rgba(20,5,27,.8));backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
#pitchOv .ph2 b{font-family:var(--disp);font-weight:800;font-size:15px}
#pitchOv .ph2 span{font-size:11px;color:var(--faint);display:block}
#pitchOv .x{margin-left:auto;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.1);
 border:none;color:#fff;font-size:16px;cursor:pointer}
.turfwrap{max-width:520px;margin:0 auto;padding:14px 14px 40px}
.half{border-radius:16px;overflow:hidden;position:relative;padding:14px 6px 20px;
 background:repeating-linear-gradient(180deg,#0F6236 0 46px,#0C5730 46px 92px)}
.half+.half{margin-top:12px}
.half:before{content:'';position:absolute;inset:0;background:radial-gradient(85% 50% at 50% 0%,rgba(255,255,255,.09),transparent 60%)}
.half .tlab2{position:relative;display:flex;align-items:center;gap:8px;padding:2px 10px 10px}
.half .tlab2 .cr2{width:30px;height:32px}
.half .tlab2 b{font-family:var(--disp);font-weight:800;font-size:13.5px;text-shadow:0 2px 6px rgba(0,0,0,.5)}
.half .tlab2 em{font-style:normal;margin-left:auto;font-family:var(--disp);font-weight:900;font-size:19px}
.prowx{position:relative;display:flex;justify-content:center;gap:7px;margin-top:8px}
.mini{width:56px;border-radius:9px;padding:5px 3px 5px;text-align:center;
 background:linear-gradient(165deg,#F7E3A5,#CDA13C 88%);color:#3D2C05;box-shadow:0 6px 14px rgba(0,0,0,.4)}
.mini.sil{background:linear-gradient(165deg,#F2F4F8,#A9B2C2 88%);color:#333A48}
.mini.brz{background:linear-gradient(165deg,#E8C4A5,#9C6B43 88%);color:#3A2410}
.mini img{width:38px;height:38px;object-fit:cover;object-position:top;border-radius:7px;display:block;margin:0 auto}
.mini .noimg{width:38px;height:38px;border-radius:7px;background:rgba(0,0,0,.14);display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:900;font-size:15px;margin:0 auto}
.mini .nm{font-size:7.6px;font-weight:800;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .pt{display:inline-block;font-family:var(--disp);font-weight:900;font-size:11px;background:rgba(0,0,0,.16);
 border-radius:7px;padding:1px 7px;margin-top:2px;font-variant-numeric:tabular-nums}

/* ---------- bottom nav ---------- */
nav{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:space-around;
 padding:9px 6px calc(10px + env(safe-area-inset-bottom));
 background:linear-gradient(180deg,rgba(20,5,27,.86),#14051B 70%);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
nav button{background:none;border:none;color:var(--faint);font-family:var(--body);font-size:10.5px;
 font-weight:600;cursor:pointer;width:76px;text-align:center}
nav button svg{display:block;margin:0 auto 3px}
nav button.on{color:#fff}
nav button.on .ub{display:block;width:20px;height:3px;border-radius:2px;background:var(--gold);margin:4px auto 0}
nav button .ub{display:none}
.state{padding:60px 24px;text-align:center;color:var(--faint);font-size:13px;line-height:1.6}
#v-table{display:none}
.foot{padding:26px 22px 8px;font-size:10.5px;color:#5E5070;line-height:1.6;text-align:center}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div id="lgBadge"></div>
  <div class="tt"><b>El Matador Tire</b><span>Matchday</span></div>
  <div id="gwChip"><b id="gwLbl">GW —</b><span id="gwCd"></span></div>
</header>

<div id="v-match">
  <div id="stages"><div class="state">Warming up the floodlights…</div></div>
  <div id="dots"></div>
  <section id="belowStage"></section>
</div>

<div id="v-table">
  <section id="tableBody"></section>
</div>

<div class="foot">Matchday build (v8 concept) · live league data · scores &amp; projections match the sheet exactly.<br>Performance-luck lives in the classic app; this build carries the Results (all-play) index.</div>
</div>

<div id="pitchOv">
  <div class="ph2"><div><b id="povT">Lineups</b><span id="povS"></span></div><button class="x" id="povX">×</button></div>
  <div class="turfwrap" id="povBody"></div>
</div>

<nav>
  <button id="nb-match" class="on"><svg width="21" height="21" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="7.2" stroke="currentColor" stroke-width="1.7"/><path d="M10 2.8v3.4M10 13.8v3.4M2.8 10h3.4M13.8 10h3.4" stroke="currentColor" stroke-width="1.7"/></svg>Matchday<span class="ub"></span></button>
  <button id="nb-table"><svg width="21" height="21" viewBox="0 0 20 20" fill="none"><path d="M4 4h12M4 10h12M4 16h8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>Table<span class="ub"></span></button>
  <button id="nb-recap"><svg width="21" height="21" viewBox="0 0 20 20" fill="none"><path d="M5 3.5h10a1.5 1.5 0 0 1 1.5 1.5v11.5l-3-2-3 2-3-2-3 2V5A1.5 1.5 0 0 1 5 3.5z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>Recap<span class="ub"></span></button>
</nav>

<script>
/* ================= crests ================= */
/* El Matador crest system — 8 bespoke club badges, one geometric family.
   Shared silhouette: modern rounded shield, team-color duotone gradient body,
   dark rim, inner keyline, white emblem, gloss sweep. Emblems are simple
   geometric marks that survive at 28px. crestSVG(mono, size) → svg string. */
const CREST = {
  PN:{c1:'#3D6BFF',c2:'#1E3FBF',name:'Cold Palmers',emblem:`
    <!-- frozen palm: trunk + 5 fronds + snowflake -->
    <g stroke="#fff" stroke-width="4.6" stroke-linecap="round" fill="none">
      <path d="M50 74 L50 46"/>
      <path d="M50 46 C 42 38, 32 36, 24 40"/>
      <path d="M50 46 C 44 34, 36 28, 26 28"/>
      <path d="M50 46 C 50 32, 46 24, 40 20"/>
      <path d="M50 46 C 56 32, 64 26, 74 26"/>
      <path d="M50 46 C 58 38, 68 36, 76 41"/>
    </g>
    <g stroke="#BFE0FF" stroke-width="3" stroke-linecap="round">
      <path d="M63 60 v12 M57 66 h12 M58.8 61.8 l8.4 8.4 M67.2 61.8 l-8.4 8.4"/>
    </g>`},
  BS:{c1:'#9B59C9',c2:'#5B1A66',name:'Trophy Hunters',emblem:`
    <!-- trophy in a crosshair -->
    <circle cx="50" cy="47" r="26" fill="none" stroke="#fff" stroke-width="3" opacity=".55"/>
    <g stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".55">
      <path d="M50 15 v9 M50 70 v9 M18 47 h9 M73 47 h9"/>
    </g>
    <g fill="#fff">
      <path d="M40 34 h20 v8 a10 10 0 0 1 -20 0 z"/>
      <path d="M38 36 a6 6 0 0 1 -6 6 M62 36 a6 6 0 0 0 6 6" stroke="#fff" stroke-width="3.4" fill="none" stroke-linecap="round"/>
      <rect x="47" y="50" width="6" height="7" rx="1"/>
      <rect x="42" y="57" width="16" height="4.5" rx="2"/>
    </g>`},
  CT:{c1:'#12BFA0',c2:'#03705F',name:'The Soaring Gulls',emblem:`
    <!-- gull over waves -->
    <g stroke="#fff" stroke-width="5" stroke-linecap="round" fill="none">
      <path d="M26 40 C 34 30, 44 30, 50 38 C 56 30, 66 30, 74 40"/>
    </g>
    <g stroke="#CFF6EE" stroke-width="3.6" stroke-linecap="round" fill="none">
      <path d="M28 60 q6 -6 12 0 t12 0 t12 0 t12 0" opacity=".9"/>
      <path d="M33 69 q6 -6 12 0 t12 0 t12 0" opacity=".55"/>
    </g>`},
  PJ:{c1:'#EF3B4A',c2:'#9E0716',name:'Devils U21s',emblem:`
    <!-- trident + horns -->
    <g stroke="#fff" stroke-width="4.4" stroke-linecap="round" fill="none">
      <path d="M50 76 V38"/>
      <path d="M38 34 v8 a12 12 0 0 0 24 0 v-8"/>
      <path d="M38 34 l-3 -7 M62 34 l3 -7"/>
      <path d="M50 38 l-6 -9 M50 38 l6 -9"/>
    </g>
    <path d="M44 29 l6 -11 6 11" stroke="#fff" stroke-width="4.4" stroke-linejoin="round" fill="none"/>`},
  EG:{c1:'#FFCB47',c2:'#C98A0A',name:'I Am a Baleba',emblem:`
    <!-- bolt through a ring — the engine-room badge -->
    <circle cx="50" cy="47" r="24" fill="none" stroke="#3B2A05" stroke-width="4" opacity=".85"/>
    <path d="M55 20 L38 50 h10 L45 74 L64 42 h-11 z" fill="#3B2A05"/>`},
  BK:{c1:'#FF8A2A',c2:'#C24E00',name:'Kobbie Mainoo Fan',emblem:`
    <!-- devotion flame + star -->
    <path d="M50 22 C 60 32, 64 40, 64 50 a14 14 0 0 1 -28 0 c0 -7 3 -11 7 -16 c0 6 2 9 6 11 c-1 -8 0 -16 11 -23z" fill="#fff" opacity=".95"/>
    <path d="M50 56 l2.7 5.6 6.2.8 -4.5 4.3 1.1 6.1 -5.5 -2.9 -5.5 2.9 1.1 -6.1 -4.5 -4.3 6.2 -.8z" fill="#FFE2B8"/>`},
  JS:{c1:'#A97B63',c2:'#5E4033',name:'Team Jacob',emblem:`
    <!-- Jacob's ladder to a star -->

function schedLuck(){

    if(!ok||Object.keys(sc).length<8)return;
    fs.forEach(f=>{[f.h,f.a].forEach(t=>{

function wireStages(){
  const sc=document.getElementById('stages'),dots=[...document.querySelectorAll('#dots i')];
  const stages=[...sc.querySelectorAll('.stage')];
  const io=new IntersectionObserver(es=>es.forEach(en=>{
    if(en.intersectionRatio>.6){
      en.target.classList.add('on');
      const i=+en.target.dataset.i;
      dots.forEach((d,j)=>d.classList.toggle('on',j===i));
      en.target.querySelectorAll('.tb i').forEach(b=>b.style.width=b.dataset.w+'%');
      odometer(en.target);
    }}),{root:sc,threshold:.6});
  stages.forEach(s=>io.observe(s));
}
function odometer(stage){
  const el=stage.querySelector('.vs .n');if(!el||el.dataset.done)return;el.dataset.done=1;
  const n1=el.dataset.n1,n2=el.dataset.n2;
  if(isNaN(parseFloat(n1)))return;
  const t0=performance.now(),dur=800;
  const step=t=>{const k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3);
    const fmt=v=>String(v).includes('.')?(parseFloat(v)*e).toFixed(1):Math.round(parseFloat(v)*e);
    el.innerHTML=fmt(n1)+'<small> – </small>'+fmt(n2);
    if(k<1)requestAnimationFrame(step);else el.innerHTML=n1+'<small> – </small>'+n2;};
  requestAnimationFrame(step);
}
function wireReveal(){
  const io=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting){en.target.classList.add('in');io.unobserve(en.target)}}),{threshold:.15});
  document.querySelectorAll('.rv').forEach(el=>io.observe(el));
}
/* header badge parallax — the scroll ruby */
let lastY=0;
addEventListener('scroll',()=>{
  const y=Math.min(scrollY,600);
  document.getElementById('lgBadge').style.transform='rotateY('+(y/600*40)+'deg) rotateZ('+(y/600*-8)+'deg)';
  lastY=y;
},{passive:true});
/* countdown */
function tickCd(){
  const el=document.getElementById('gwCd');
  if(!D.dl){el.textContent='';return}
  const ms=D.dl-Date.now();
  if(ms<=0){el.textContent=D.dlPassed?'':'';return}
  const d=Math.floor(ms/864e5),h=Math.floor(ms%864e5/36e5),m=Math.floor(ms%36e5/6e4);
  el.textContent='⏱ '+(d>0?d+'d '+h+'h':h>0?h+'h '+m+'m':m+'m')+' to deadline';
}
setInterval(tickCd,30000);
/* nav */
const views={match:document.getElementById('v-match'),table:document.getElementById('v-table')};
function nav(v){
  views.match.style.display=v==='match'?'block':'none';
  views.table.style.display=v==='table'?'block':'none';
  document.getElementById('nb-match').classList.toggle('on',v==='match');
  document.getElementById('nb-table').classList.toggle('on',v==='table');
  scrollTo({top:0});
  if(v==='table')document.querySelectorAll('#v-table .rv').forEach(el=>el.classList.add('in'));
}
document.getElementById('nb-match').onclick=()=>nav('match');
document.getElementById('nb-table').onclick=()=>nav('table');
document.getElementById('nb-recap').onclick=()=>location.href='recap-gw2.html';
